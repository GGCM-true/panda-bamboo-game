<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊猫吃竹笋 - 五关闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e8f5e9;
            text-align: center;
            font-family: "微软雅黑", Arial;
            margin: 0;
            padding: 20px 0;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 500px;
            margin-bottom: 10px;
        }
        .mode-buttons {
            display: flex;
            gap: 8px;
        }
        .mode-btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #4caf50;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "微软雅黑", Arial;
        }
        .mode-btn.active {
            background: #4caf50;
            color: #ffffff;
        }
        .mode-btn:not(.active) {
            background: #ffffff;
            color: #4caf50;
        }
        .mode-btn:hover {
            opacity: 0.85;
        }
        .back-link {
            font-size: 14px;
            color: #2e7d32;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #a5d6a7;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: #c8e6c9;
        }
        .tip {
            font-size: 16px;
            color: #2e7d32;
            margin-bottom: 8px;
        }
        canvas {
            border: 4px solid #4caf50;
            border-radius: 12px;
            background: #f1f8e9;
            cursor: pointer;
        }
        .timer-display {
            margin-top: 10px;
            font-size: 18px;
            color: #2e7d32;
            font-weight: bold;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="top-bar">
            <div class="mode-buttons">
                <button class="mode-btn active" id="btnClassic" onclick="switchMode('classic')">经典模式</button>
                <button class="mode-btn" id="btnSpeed" onclick="switchMode('speed')">竞速模式</button>
            </div>
            <a href="index.html" class="back-link">← 返回封面</a>
        </div>
        <div class="tip">⬅️ ➡️ ⬆️ ⬇️ 方向键移动熊猫 | 收集竹笋通关，触碰礼物可变竹笋</div>
        <canvas id="gameCanvas" width="500" height="400"></canvas>
        <div class="timer-display" id="timerDisplay"></div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ==================== 游戏基础配置 ====================
const levelTotal = 5; // 总关卡数
const levelNeed = [3, 6, 9, 12, 15]; // 每关需要收集的竹笋数量
const levelTipWords = [
    "第一关已完成！",
    "第二关已完成！",
    "第三关已完成！",
    "第四关已完成！",
    "全部通关！太厉害了！"
]; // 每关通关提示语（有明确意义）

// ==================== 游戏状态 ====================
let nowLevel = 1;       // 当前关卡
let eatCount = 0;       // 已吃掉竹笋数
let gameWin = false;    // 是否全部通关
let gamePaused = false; // 是否暂停（弹窗显示时暂停）

// 游戏模式
let gameMode = 'classic'; // 'classic' 或 'speed'

// 竞速模式计时器
let timerStart = 0;
let timerRunning = false;
let timerElapsed = 0; // 最终用时（秒）

// Canvas 内弹窗状态
let popup = {
    show: false,
    title: "",
    message: "",
    buttonText: "",
    isFinalWin: false  // 是否为最终通关弹窗
};

// 熊猫属性
const panda = {
    x: 230,
    y: 300,
    w: 40,
    h: 40,
    speed: 4
};

// 竹笋、礼物数组
let bambooList = [];
let giftList = [];

// ==================== 模式切换 ====================
function switchMode(mode) {
    gameMode = mode;
    document.getElementById('btnClassic').classList.toggle('active', mode === 'classic');
    document.getElementById('btnSpeed').classList.toggle('active', mode === 'speed');
    document.getElementById('timerDisplay').textContent = '';
    timerRunning = false;
    timerElapsed = 0;
    resetGame();
}

// ==================== 按键监听 ====================
const keyState = {};
document.addEventListener('keydown', e => {
    // 弹窗显示时，忽略方向键，防止按键状态残留
    if (popup.show) return;
    keyState[e.key] = true;
});
document.addEventListener('keyup', e => {
    keyState[e.key] = false;
});

// Canvas 鼠标点击（用于弹窗按钮）
canvas.addEventListener('click', e => {
    if (!popup.show) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    // 检查是否点击了弹窗按钮
    const btnX = canvas.width / 2 - 60;
    const btnY = canvas.height / 2 + 30;
    const btnW = 120;
    const btnH = 40;

    if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
        handlePopupButtonClick();
    }
});

// Canvas 键盘点击（Enter/Space 触发弹窗按钮）
document.addEventListener('keydown', e => {
    if (!popup.show) return;
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handlePopupButtonClick();
    }
});

// ==================== 弹窗按钮点击处理 ====================
function handlePopupButtonClick() {
    popup.show = false;
    gamePaused = false;

    // 清除所有按键状态，防止残留
    for (let key in keyState) {
        keyState[key] = false;
    }

    if (popup.isFinalWin) {
        // 全部通关 → 重新开始游戏
        resetGame();
    } else {
        // 进入下一关
        nowLevel++;
        initLevel();
    }
}

// ==================== 初始化当前关卡 ====================
function initLevel() {
    eatCount = 0;
    bambooList = [];
    giftList = [];
    panda.x = 230;
    panda.y = 300;

    // 生成初始竹笋
    const num = levelNeed[nowLevel - 1] + 3;
    for (let i = 0; i < num; i++) {
        createBamboo();
    }
    // 随机生成礼物
    createGift();
}

// ==================== 重新开始游戏 ====================
function resetGame() {
    nowLevel = 1;
    gameWin = false;
    popup.show = false;
    gamePaused = false;

    // 竞速模式重置计时器
    if (gameMode === 'speed') {
        timerStart = Date.now();
        timerRunning = true;
        timerElapsed = 0;
        document.getElementById('timerDisplay').textContent = '⏱ 计时中...';
    }

    // 清除所有按键状态
    for (let key in keyState) {
        keyState[key] = false;
    }

    initLevel();
}

// ==================== 生成竹笋 ====================
function createBamboo() {
    let x = Math.random() * (canvas.width - 30);
    let y = Math.random() * 220 + 50;
    bambooList.push({ x, y, w: 25, h: 35 });
}

// ==================== 生成礼物 ====================
function createGift() {
    let x = Math.random() * (canvas.width - 25);
    let y = Math.random() * 200 + 40;
    giftList.push({ x, y, w: 25, h: 25 });
}

// ==================== 碰撞检测 ====================
function isCollide(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

// ==================== 熊猫移动逻辑 ====================
function movePanda() {
    if (keyState['ArrowLeft']) {
        panda.x -= panda.speed;
    }
    if (keyState['ArrowRight']) {
        panda.x += panda.speed;
    }
    if (keyState['ArrowUp']) {
        panda.y -= panda.speed;
    }
    if (keyState['ArrowDown']) {
        panda.y += panda.speed;
    }
    // 边界限制
    panda.x = Math.max(0, Math.min(canvas.width - panda.w, panda.x));
    panda.y = Math.max(0, Math.min(canvas.height - panda.h, panda.y));
}

// ==================== 碰撞判断：吃竹笋 & 触碰礼物 ====================
function checkCollide() {
    // 吃竹笋
    for (let i = bambooList.length - 1; i >= 0; i--) {
        if (isCollide(panda, bambooList[i])) {
            bambooList.splice(i, 1);
            eatCount++;
        }
    }
    // 触碰礼物，礼物变竹笋
    for (let i = giftList.length - 1; i >= 0; i--) {
        if (isCollide(panda, giftList[i])) {
            giftList.splice(i, 1);
            createBamboo();
        }
    }
    // 判断本关是否通关
    if (eatCount >= levelNeed[nowLevel - 1]) {
        passLevel();
    }
}

// ==================== 通关逻辑（Canvas 内弹窗，替代 alert） ====================
function passLevel() {
    gamePaused = true; // 暂停游戏

    // 清除所有按键状态，防止弹窗期间按键残留导致重复触发
    for (let key in keyState) {
        keyState[key] = false;
    }

    if (nowLevel < levelTotal) {
        // 还没到最后一关 → 显示通关弹窗 + "继续"按钮
        popup.show = true;
        popup.title = "🎉 通关！";
        popup.message = levelTipWords[nowLevel - 1];
        popup.buttonText = "继续下一关 →";
        popup.isFinalWin = false;
    } else {
        // 全部5关通关
        gameWin = true;

        // 竞速模式：停止计时
        if (gameMode === 'speed' && timerRunning) {
            timerRunning = false;
            timerElapsed = ((Date.now() - timerStart) / 1000).toFixed(1);
        }

        popup.show = true;
        popup.title = "🏆 恭喜通关！";
        popup.message = gameMode === 'speed'
            ? `全部5关已通关！用时 ${timerElapsed} 秒`
            : "全部5关已通关，太厉害了！";
        popup.buttonText = "再次游玩 🔄";
        popup.isFinalWin = true;
    }
}

// ==================== 绘制熊猫 ====================
function drawPanda() {
    // 身体（白色圆）
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(panda.x + 20, panda.y + 20, 20, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    // 耳朵
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(panda.x + 8, panda.y + 8, 8, 0, Math.PI * 2);
    ctx.arc(panda.x + 32, panda.y + 8, 8, 0, Math.PI * 2);
    ctx.fill();
    // 眼圈
    ctx.beginPath();
    ctx.ellipse(panda.x + 12, panda.y + 18, 6, 8, 0, 0, Math.PI * 2);
    ctx.ellipse(panda.x + 28, panda.y + 18, 6, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // 鼻子
    ctx.beginPath();
    ctx.arc(panda.x + 20, panda.y + 28, 4, 0, Math.PI * 2);
    ctx.fill();
}

// ==================== 绘制竹笋 ====================
function drawBamboo(item) {
    ctx.fillStyle = "#7cb342";
    ctx.fillRect(item.x, item.y, item.w, item.h);
    ctx.fillStyle = "#558b2f";
    ctx.fillRect(item.x + 10, item.y, 5, item.h);
}

// ==================== 绘制礼物 ====================
function drawGift(item) {
    ctx.fillStyle = "#ff7043";
    ctx.fillRect(item.x, item.y, item.w, item.h);
    ctx.fillStyle = "#ffeb3b";
    ctx.fillRect(item.x + 10, item.y, 5, item.h);
    ctx.fillRect(item.x, item.y + 10, item.w, 5);
}

// ==================== 绘制界面文字 ====================
function drawText() {
    ctx.fillStyle = "#2e7d32";
    ctx.font = "bold 20px 微软雅黑";
    ctx.textAlign = "left";
    ctx.fillText(`第 ${nowLevel} 关 / 共5关`, 15, 28);
    ctx.fillText(`已收集：${eatCount} / 需要：${levelNeed[nowLevel - 1]}`, 15, 58);

    // 竞速模式：在 Canvas 右上角显示计时器
    if (gameMode === 'speed' && timerRunning) {
        const elapsed = ((Date.now() - timerStart) / 1000).toFixed(1);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ff6f00";
        ctx.font = "bold 22px 微软雅黑";
        ctx.fillText(`⏱ ${elapsed}s`, canvas.width - 15, 28);
        ctx.textAlign = "left";
    }
}

// ==================== 绘制 Canvas 内弹窗 ====================
function drawPopup() {
    if (!popup.show) return;

    // 半透明遮罩
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 弹窗背景
    const popW = 300;
    const popH = 180;
    const popX = (canvas.width - popW) / 2;
    const popY = (canvas.height - popH) / 2;

    // 圆角矩形背景
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    const r = 16;
    ctx.moveTo(popX + r, popY);
    ctx.lineTo(popX + popW - r, popY);
    ctx.quadraticCurveTo(popX + popW, popY, popX + popW, popY + r);
    ctx.lineTo(popX + popW, popY + popH - r);
    ctx.quadraticCurveTo(popX + popW, popY + popH, popX + popW - r, popY + popH);
    ctx.lineTo(popX + r, popY + popH);
    ctx.quadraticCurveTo(popX, popY + popH, popX, popY + popH - r);
    ctx.lineTo(popX, popY + r);
    ctx.quadraticCurveTo(popX, popY, popX + r, popY);
    ctx.closePath();
    ctx.fill();

    // 绿色边框
    ctx.strokeStyle = "#4caf50";
    ctx.lineWidth = 3;
    ctx.stroke();

    // 标题
    ctx.fillStyle = "#2e7d32";
    ctx.font = "bold 24px 微软雅黑";
    ctx.textAlign = "center";
    ctx.fillText(popup.title, canvas.width / 2, popY + 45);

    // 提示信息
    ctx.fillStyle = "#555555";
    ctx.font = "18px 微软雅黑";
    ctx.fillText(popup.message, canvas.width / 2, popY + 80);

    // 按钮
    const btnX = canvas.width / 2 - 60;
    const btnY = popY + 105;
    const btnW = 120;
    const btnH = 40;

    ctx.fillStyle = "#4caf50";
    ctx.beginPath();
    const br = 8;
    ctx.moveTo(btnX + br, btnY);
    ctx.lineTo(btnX + btnW - br, btnY);
    ctx.quadraticCurveTo(btnX + btnW, btnY, btnX + btnW, btnY + br);
    ctx.lineTo(btnX + btnW, btnY + btnH - br);
    ctx.quadraticCurveTo(btnX + btnW, btnY + btnH, btnX + btnW - br, btnY + btnH);
    ctx.lineTo(btnX + br, btnY + btnH);
    ctx.quadraticCurveTo(btnX, btnY + btnH, btnX, btnY + btnH - br);
    ctx.lineTo(btnX, btnY + br);
    ctx.quadraticCurveTo(btnX, btnY, btnX + br, btnY);
    ctx.closePath();
    ctx.fill();

    // 按钮文字
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px 微软雅黑";
    ctx.fillText(popup.buttonText, canvas.width / 2, btnY + 26);

    // 恢复左对齐
    ctx.textAlign = "left";
}

// ==================== 更新 HTML 计时器显示 ====================
function updateTimerDisplay() {
    const display = document.getElementById('timerDisplay');
    if (gameMode === 'speed') {
        if (timerRunning) {
            const elapsed = ((Date.now() - timerStart) / 1000).toFixed(1);
            display.textContent = `⏱ 计时中：${elapsed} 秒`;
        } else if (timerElapsed > 0) {
            display.textContent = `🏁 本次游戏共用时 ${timerElapsed} 秒`;
        }
    } else {
        display.textContent = '';
    }
}

// ==================== 主绘制函数 ====================
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制游戏元素
    giftList.forEach(drawGift);
    bambooList.forEach(drawBamboo);
    drawPanda();
    drawText();

    // 绘制弹窗（最上层）
    drawPopup();
}

// ==================== 游戏主循环 ====================
function gameLoop() {
    if (!gamePaused && !gameWin) {
        movePanda();
        checkCollide();
    }
    render();
    updateTimerDisplay();
    requestAnimationFrame(gameLoop);
}

// ==================== 初始化游戏 ====================
initLevel();
gameLoop();
</script>
</body>
</html>
