<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊猫吃竹笋 - 五关闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "微软雅黑", Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('assets/cover-bg.jpg') center center / cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
        }
        .cover-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .game-title {
            font-size: 56px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
        }
        .game-subtitle {
            font-size: 22px;
            color: #e8f5e9;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
        }
        .start-btn {
            display: inline-block;
            padding: 18px 60px;
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="cover-content">
            <div class="game-title">🐼 熊猫吃竹笋</div>
            <div class="game-subtitle">五关闯关挑战 · 收集竹笋通关</div>
            <a href="game.html" class="start-btn">开始游戏 ▶</a>
        </div>
    </div>
</body>
</html>
